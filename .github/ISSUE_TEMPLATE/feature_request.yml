name: "💡 Предложение"
description: "Предложить новую функцию или улучшение"
title: "[IDEA] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Issues видны всем. Не размещайте личные контакты, пароли, ключи и другие приватные данные."
  - type: textarea
    id: idea
    attributes:
      label: Что предлагаете?
      description: Опишите идею. Какую проблему она решает?
      placeholder: "Например: добавить звук при появлении сделки с скидкой >50%..."
    validations:
      required: true
